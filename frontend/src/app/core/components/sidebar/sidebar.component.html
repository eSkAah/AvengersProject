<aside class="sidebar" [class.sidebar--collapsed]="collapsed" [class.sidebar--mobile-open]="mobileOpen">
  <div class="sidebar__logo">
    <lucide-icon name="zap" class="sidebar__logo-icon" [size]="20"></lucide-icon>
    <span class="sidebar__logo-text" *ngIf="!collapsed">Avengers</span>
  </div>

  <nav class="sidebar__nav">
    @for (item of navItems; track item.route) {
      <a
        class="sidebar__nav-item"
        [routerLink]="item.route"
        routerLinkActive="sidebar__nav-item--active"
        [routerLinkActiveOptions]="{ exact: item.route === '/app' }"
      >
        <lucide-icon [name]="item.icon" class="sidebar__nav-icon" [size]="20"></lucide-icon>
        <span class="sidebar__nav-label" *ngIf="!collapsed">{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- User Profile Section -->
  <div class="sidebar__footer">
    <div class="sidebar__divider"></div>

    <div class="sidebar__profile" (click)="toggleProfileMenu()">
      <div class="sidebar__profile-avatar">
        {{ userProfile.initials }}
      </div>
      <div class="sidebar__profile-info" *ngIf="!collapsed">
        <span class="sidebar__profile-name">{{ userProfile.name }}</span>
        <span class="sidebar__profile-role">{{ userProfile.role }}</span>
      </div>
      <lucide-icon
        *ngIf="!collapsed"
        [name]="showProfileMenu ? 'chevron-up' : 'chevron-down'"
        class="sidebar__profile-chevron"
        [size]="16"
      ></lucide-icon>
    </div>

    <!-- Profile Menu Dropdown -->
    <div class="sidebar__profile-menu" *ngIf="showProfileMenu && !collapsed">
      <a class="sidebar__profile-menu-item" routerLink="/app/profile">
        <lucide-icon name="user" [size]="16"></lucide-icon>
        <span>Profile</span>
      </a>
      <a class="sidebar__profile-menu-item" routerLink="/app/settings">
        <lucide-icon name="settings" [size]="16"></lucide-icon>
        <span>Settings</span>
      </a>
      <div class="sidebar__profile-menu-divider"></div>
      <button class="sidebar__profile-menu-item sidebar__profile-menu-item--logout" (click)="logout()">
        <lucide-icon name="log-out" [size]="16"></lucide-icon>
        <span>Logout</span>
      </button>
    </div>

    <button class="sidebar__toggle" (click)="toggleCollapse()" [attr.aria-label]="collapsed ? 'Expand sidebar' : 'Collapse sidebar'">
      <lucide-icon [name]="collapsed ? 'chevron-right' : 'chevron-left'" class="sidebar__toggle-icon" [size]="16"></lucide-icon>
    </button>
  </div>
</aside>
