<div class="document-tree">
  <ng-container *ngTemplateOutlet="treeNodeTpl; context: { node: treeData(), level: 0 }"></ng-container>
</div>

<ng-template #treeNodeTpl let-node="node" let-level="level">
  <div
    class="tree-node"
    [class.tree-node--selected]="isSelected(node.id)"
    [style.padding-left.px]="level * 16"
  >
    <div class="tree-node__content" (click)="selectNode(node)">
      <!-- Expand/Collapse toggle -->
      <button
        *ngIf="hasChildren(node)"
        class="tree-node__toggle"
        (click)="toggleExpand(node.id, $event)"
      >
        <span [class.rotated]="isExpanded(node.id)">▶</span>
      </button>
      <span *ngIf="!hasChildren(node)" class="tree-node__spacer"></span>

      <!-- Icon -->
      <span class="tree-node__icon">{{ node.icon }}</span>

      <!-- Label -->
      <span class="tree-node__label">{{ node.label }}</span>

      <!-- Count badge -->
      <span *ngIf="node.count !== undefined" class="tree-node__count">
        {{ node.count }}
      </span>
    </div>
  </div>

  <!-- Children -->
  <div class="tree-node__children" *ngIf="hasChildren(node) && isExpanded(node.id)">
    <ng-container *ngFor="let child of node.children">
      <ng-container *ngTemplateOutlet="treeNodeTpl; context: { node: child, level: level + 1 }"></ng-container>
    </ng-container>
  </div>
</ng-template>
