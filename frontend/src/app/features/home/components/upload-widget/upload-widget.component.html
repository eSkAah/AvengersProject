<div class="upload-widget">
  <div class="upload-widget__header">
    <lucide-icon [img]="icons.upload" [size]="18"></lucide-icon>
    <h3>Upload Document</h3>
  </div>

  <!-- Compact Upload Zone -->
  <div
    class="upload-zone"
    [class.upload-zone--dragover]="isDragOver()"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <input
      type="file"
      id="file-upload"
      class="upload-zone__input"
      multiple
      accept=".pdf,.doc,.docx,.xls,.xlsx"
      (change)="onFileSelect($event)"
    />
    <label for="file-upload" class="upload-zone__content">
      <lucide-icon [img]="icons.upload" [size]="24"></lucide-icon>
      <span class="upload-zone__text">Drop files or click to browse</span>
    </label>
  </div>
</div>
