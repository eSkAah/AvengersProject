<div class="tax-news-widget">
  <div class="tax-news-widget__header">
    <div class="tax-news-widget__title">
      <h3>Tax News & Insights</h3>
    </div>
    <span class="tax-news-widget__subtitle">Latest updates from industry leaders</span>
  </div>

  <div class="tax-news-widget__grid">
    @for (item of news; track item.id) {
      <article class="news-card" (click)="onNewsClick(item)">
        <div class="news-card__image">
          <img [src]="item.imageUrl" [alt]="item.title" loading="lazy" />
          <span class="news-card__category" [class]="getCategoryClass(item.category)">
            {{ getCategoryLabel(item.category) }}
          </span>
        </div>

        <div class="news-card__content">
          <div class="news-card__meta">
            <span class="news-card__source">{{ item.source }}</span>
            <span class="news-card__date">{{ formatDate(item.date) }}</span>
          </div>

          <h4 class="news-card__title">{{ item.title }}</h4>
          <p class="news-card__summary">{{ item.summary }}</p>

          <span class="news-card__link">
            Read more
            <lucide-icon [img]="icons.externalLink" [size]="14"></lucide-icon>
          </span>
        </div>
      </article>
    }
  </div>
</div>
