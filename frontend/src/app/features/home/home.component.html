<div class="dashboard">
  <!-- Header -->
  <div class="dashboard__header">
    <div class="dashboard__header-content">
      <lucide-icon [img]="icons.layoutDashboard" [size]="28"></lucide-icon>
      <div>
        <h1>Dashboard</h1>
        <p>Overview of your engagements and documents</p>
      </div>
    </div>
  </div>

  <!-- Bento Grid -->
  <div class="bento-grid">
    <!-- Widget 1: Upload & Missing Documents (Left, tall) -->
    <div class="bento-card bento-card--upload">
      <app-upload-widget (uploadFiles)="onFilesUpload($event)"></app-upload-widget>
    </div>

    <!-- Widget 2: Engagement Status Donut (Right, top) -->
    <div class="bento-card bento-card--donut">
      <app-donut-widget (segmentSelect)="onDonutSegmentChange($event)"></app-donut-widget>
    </div>

    <!-- Widget 3: Documents to Sign Off (Right, bottom) -->
    <div class="bento-card bento-card--signoff">
      <app-signoff-widget></app-signoff-widget>
    </div>

    <!-- Widget 4: Engagement List (Full width, bottom) -->
    <div class="bento-card bento-card--engagements">
      <app-engagement-list-widget [filter]="selectedDonutSegment()"></app-engagement-list-widget>
    </div>
  </div>
</div>
