<div class="dashboard">
  <!-- Header -->
  <div class="dashboard__header">
    <div class="dashboard__header-content">
      <lucide-icon [img]="icons.layoutDashboard" [size]="28"></lucide-icon>
      <div>
        <h1>Dashboard</h1>
        <p>Overview of your engagements and documents</p>
      </div>
    </div>
  </div>

  <!-- Bento Grid -->
  <div class="bento-grid">
    <!-- Left Column: Subscribed Services (Large) -->
    <div class="bento-card bento-card--services">
      <app-services-widget></app-services-widget>
    </div>

    <!-- Right Column: Upload, Missing Docs, Sign Off -->
    <div class="bento-column-right">
      <!-- Upload Document (Compact) -->
      <div class="bento-card bento-card--upload">
        <app-upload-widget (uploadFiles)="onFilesUpload($event)"></app-upload-widget>
      </div>

      <!-- Missing Documents -->
      <div class="bento-card bento-card--missing">
        <app-missing-docs-widget></app-missing-docs-widget>
      </div>

      <!-- Documents to Sign Off -->
      <div class="bento-card bento-card--signoff">
        <app-signoff-widget></app-signoff-widget>
      </div>
    </div>

    <!-- Full Width: Tax News & Insights -->
    <div class="bento-card bento-card--news">
      <app-tax-news-widget></app-tax-news-widget>
    </div>
  </div>
</div>
