<div class="bento-home">
  <!-- Bento Grid - Apple/Stripe Premium Layout -->
  <div class="bento-grid">
    <!-- TOP ROW: Welcome + Upload in same Bento style -->
    <div class="bento-tile bento-tile--welcome">
      <div class="welcome-content">
        <h1>Welcome back, <span class="user-name">John</span></h1>
        <p>Your engagement overview and quick actions</p>
      </div>
      <div class="welcome-date">
        <span class="day">{{ today | date:'EEEE' }}</span>
        <span class="date">{{ today | date:'d MMMM yyyy' }}</span>
      </div>
    </div>

    <div class="bento-tile bento-tile--upload">
      <app-drop-file-widget></app-drop-file-widget>
    </div>

    <!-- LEFT COLUMN -->
    <div class="bento-tile bento-tile--services">
      <app-services-widget></app-services-widget>
    </div>

    <div class="bento-tile bento-tile--activity">
      <app-recent-activity-widget></app-recent-activity-widget>
    </div>

    <div class="bento-tile bento-tile--contacts">
      <app-contacts-widget></app-contacts-widget>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="bento-tile bento-tile--missing">
      <app-missing-documents-widget></app-missing-documents-widget>
    </div>

    <div class="bento-tile bento-tile--signoff">
      <app-signoff-widget></app-signoff-widget>
    </div>

    <div class="bento-tile bento-tile--news">
      <app-tax-news-widget></app-tax-news-widget>
    </div>
  </div>
</div>
