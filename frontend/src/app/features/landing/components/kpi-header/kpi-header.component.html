<!-- EY Design System - KPI Header Row -->
<div class="kpi-header" @staggerCards>
  @for (config of kpiConfigs; track config.filter) {
    <div class="kpi-card-wrapper">
      <app-kpi-card
        [value]="getValue(config.filter)"
        [label]="config.label"
        [icon]="config.icon"
        [variant]="getVariant(config)"
        [active]="isActive(config.filter)"
        (cardClick)="onFilterClick(config.filter)"
      ></app-kpi-card>
    </div>
  }
</div>
